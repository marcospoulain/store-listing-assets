<!doctype html>
<!-- Gráfico de funciones: 1024x500, sin alfa. Foco centrado, nada importante en los bordes.
     Sin marcos de dispositivo, sin CTA ni claims ("gratis", "el mejor"...).
     Render: node ../scripts/compose.mjs feature-graphic.html ../final/feature-graphic-1024x500.png 1024 500 -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Brand;src:url('{{RUTA_FUENTE}}');}
  html,body{margin:0;width:100%;height:100%;}
  body{
    background: url('{{../raw/feature-bg.png}}') center/cover, linear-gradient(120deg, {{PRIMARY}}, {{ACCENT}});
    font-family:Brand, system-ui, sans-serif; color:{{FOREGROUND}};
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  /* Zona segura: el 60 % central */
  .safe{width:60%;text-align:center;}
  h1{font-size:64px;line-height:1;margin:0 0 12px;font-weight:800;letter-spacing:-.5px;}
  p{font-size:28px;margin:0;opacity:.9;}
  /* Borra .safe si el arte ya comunica todo sin texto */
</style></head><body>
  <div class="safe"><h1>{{APP_NAME}}</h1><p>{{ESLOGAN_CORTO_SIN_CTA}}</p></div>
</body></html>
