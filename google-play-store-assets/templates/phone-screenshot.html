<!doctype html>
<!-- Screenshot de teléfono para Google Play: 1440x2560 (9:16), sin alfa.
     - SIN marco de dispositivo (Play desaconseja imágenes de dispositivos).
     - Leyenda en una banda ≤ 18 % del alto (Play: leyendas ≤ 20 % de la imagen), sin CTA ni claims.
     - Las 3 primeras imágenes del set deben priorizar la UI.
     Render: node ../scripts/compose.mjs phone-01.html ../final/phone/01.png 1440 2560 -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Brand;src:url('{{RUTA_FUENTE}}');}
  html,body{margin:0;width:100%;height:100%;}
  body{
    background: url('{{../raw/phone-01-bg.png}}') center/cover, linear-gradient(165deg, {{PRIMARY}}, {{SECONDARY}});
    font-family:Brand, system-ui, sans-serif; color:{{FOREGROUND}};
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
  }
  .caption{height:16%;width:84%;display:flex;align-items:center;justify-content:center;text-align:center;}
  .caption h1{font-size:96px;line-height:1.05;margin:0;font-weight:800;}
  /* Captura real con esquinas redondeadas, sin marco */
  .ui{width:82%;flex:1;margin-bottom:5%;border-radius:64px;overflow:hidden;
      box-shadow:0 40px 100px rgba(0,0,0,.28);background:#fff;}
  .ui img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;}
  /* object-fit:cover recorta la parte baja de capturas 20:9; usa object-fit:contain y un fondo del color de la app si debe verse completa. */
  /* Para una captura a pantalla completa sin leyenda: borra .caption y usa .ui{width:100%;margin:0;border-radius:0} */
</style></head><body>
  <div class="caption"><h1>{{LEYENDA_CORTA}}</h1></div>
  <div class="ui"><img src="{{../screens/phone-01.png}}"></div>
</body></html>
